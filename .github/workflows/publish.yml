name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (OIDC), no token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  move-major-tag:
    # Keep the stable action-interface tag (v1) pointing at the latest release,
    # so `uses: ingrid-owusu/mdoctest@v1` always resolves. Bump to v2 by hand on
    # a breaking change to the action's inputs.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance v1 tag to this release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Idempotent: skip if the remote v1 already points here (e.g. advanced
          # manually before release), so this job stays green instead of racing
          # on a rejected non-fast-forward push.
          remote_v1="$(git ls-remote origin refs/tags/v1 | cut -f1)"
          if [ "${remote_v1}" = "${GITHUB_SHA}" ]; then
            echo "v1 already at ${GITHUB_SHA}; nothing to do."
            exit 0
          fi
          git tag -f v1 "${GITHUB_SHA}"
          git push -f origin v1
