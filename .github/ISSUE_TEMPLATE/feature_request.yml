name: Feature request
description: Suggest a capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What documentation-testing pain are you hitting?
      description: Describe the concrete problem, ideally with an example doc.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like mdoctest to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you've considered
    validations:
      required: false
